{% extends 'basic_layout.html' %}

{% load static %}

{% block css %}
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-datetimepicker/css/bootstrap-datetimepicker.min.css' %}">
{% endblock %}

{% block js %}
    <script src="{% static 'plugins/bootstrap-datetimepicker/js/bootstrap-datetimepicker.min.js' %}"></script>
    <script src="{% static 'plugins/bootstrap-datetimepicker/js/locales/bootstrap-datetimepicker.zh-CN.js' %}"></script>
    <!-- 使用datetimepicker插件实现日期的选择 -->
    <script type="text/javascript">
        $(function () {
            $("#id_create_time").datetimepicker({
                format: "yyyy-mm-dd",
                startDate: "0",
                language: "zh-CN",
                autoclose: true
            });
        });
    </script>
{% endblock %}

{% block content %}
    <!-- 带有表单的面板，用于新建用户 -->
    <div class="container" style="margin: 20px auto">
        <div class="panel panel-default">
            <div class="panel-heading">
                <!-- <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span> 新建用户 -->
                <h3 class="panel-title"> 新建用户 </h3>
            </div>
            <div class="panel-body">
                <!-- novalidate属性表示提交表单时关闭浏览器的校验功能 -->
                <form method="post" action="/user/add/" novalidate>
                    {% csrf_token %}
                    <!-- 如果新增用户失败，则弹框提示 -->
                    {% if err_msg %}
                        <script type="text/javascript">
                            alert("{{ err_msg }}");
                        </script>
                    {% endif %}
                    <!-- ModelForm方式 -->
                    <!-- 通过ModelForm方式生成的标签会给每个字段标签生成一个id="id_字段名"，例如 UserInfo 的username字段，生成的标签如下：
                     <input type="text" name="username" class="form-control" placeholder="用户名" id="id_username"> -->
                    {% for field in form %}
                        <label>
                            {{ field.label }} <span style="color: red">{{ field.errors.0 }}</span>
                        </label>
                        {{ field }}
                    {% endfor %}

                    <!-- 原始方式
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" class="form-control" name="user" placeholder="用户名"/>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" class="form-control" name="pwd" placeholder="密码"/>
                    </div>
                    <div class="form-group">
                        <label>年龄</label>
                        <input type="text" class="form-control" name="age" placeholder="年龄"/>
                    </div>
                    <div class="form-group">
                        <label>性别</label>
                        <select class="form-group">
                            {% for item in gender_choice %}
                            	<option value="{{ item.0 }}">{{ item.1 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>账户余额</label>
                        <input type="text" class="form-control" name="account" placeholder="账户余额"/>
                    </div>
                    <div class="form-group">
                        <label>入职时间</label>
                        <input type="text" class="form-control" name="ctime" placeholder="入职时间"/>
                    </div>
                    <div class="form-group">
                        <label>所属部门</label>
                        <select class="form-group">
                            {% for item in departs %}
                            	<option value="{{ item.id }}">{{ item.title }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    -->
                    <input type="submit" class="btn btn-primary" value="提 交">
                </form>
            </div>
        </div>
    </div>
{% endblock %}
