{% extends 'basic_layout.html' %}

{% block content %}
    <!-- 带有表单的面板，用于新建部门 -->
    <div class="container" style="margin: 20px auto">
        <div class="panel panel-default">
            <div class="panel-heading">
                <!-- <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span> 新建部门 -->
                <h3 class="panel-title"> 新建部门 </h3>
            </div>
            <div class="panel-body">
                <form method="post" action="/depart/add/">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>部门</label>
                        <input type="text" class="form-control" name="depart" placeholder="部门名称"/>
                    </div>
                    <input type="submit" class="btn btn-primary" value="提 交">
                </form>
            </div>
        </div>
    </div>
{% endblock %}
