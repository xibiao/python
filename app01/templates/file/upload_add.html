{% extends 'basic_layout.html' %}

{% block js %}
    <script type="text/javascript">
        $(function () {
            {% if status %}
                alert("上传成功！")
            {% endif %}
        })
    </script>
{% endblock %}

{% block content %}
    <div class="container">
        <!-- 面板 -->
        <div class="panel panel-default">
            <!-- Default panel contents -->
            <div class="panel-heading">
                <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span> 批量上传
            </div>
            <div class="panel-body">
                <form method="post" enctype="multipart/form-data" action="/upload/file/">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="file" name="file">
                    </div>
                    <input type="submit" class="btn btn-info btn-sm" value="上 传">
                </form>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 面板 -->
        <div class="panel panel-default">
            <!-- Default panel contents -->
            <div class="panel-heading">
                <h3 class="panel-title">用户信息</h3>
            </div>
            <div class="panel-body">
                <form method="post" enctype="multipart/form-data" action="/upload/add/" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label>{{ field.label }}</label>
                            {{ field }}
                            <span style="color: red">{{ field.errors.0 }}</span>
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-primary">提 交</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
